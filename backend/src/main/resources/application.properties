# ============================================================================
# NourishNet Backend Configuration
# ============================================================================

server.port=8080

# MySQL Database DataSource (Configured via Environment Variables with Localhost Defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nourishnet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
# Schema is manually created and validated against the MySQL database
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
nourishnet.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
nourishnet.jwt.expiration-ms=86400000

# Logging
logging.level.org.nourishnet=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
